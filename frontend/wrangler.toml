# Cloudflare Workers config.
#
# This project runs on Workers + Static Assets (Cloudflare's recommended
# successor to Pages). The Worker entry is `functions/worker.ts`; it
# handles /api/* routes. Everything else is served directly from the
# static export in out/ by the [assets] binding.
#
# Deploy:
#   pnpm build                        # next build → out/
#   npx wrangler deploy               # bundles worker + uploads assets
#
# Required one-time setup:
#
#   # 1. KV namespace for magic-link tokens
#   npx wrangler kv namespace create MAGIC_LINKS
#   # → copy the returned id into the `id` field below
#
#   # 2. Enable Email Routing on skyhitz.io in the Cloudflare dashboard
#   #    and verify at least one destination address. The send_email
#   #    binding refuses to deliver until this is done.
#
#   # 3. Generate a 32-byte hex master secret and put it in Cloudflare:
#   node -e 'console.log(crypto.randomBytes(32).toString("hex"))'
#   npx wrangler secret put MASTER_SECRET
#
#   # 4. Find the gas-sponsor address (deterministic from MASTER_SECRET):
#   curl https://skyhitz.io/api/gateway/sponsor
#   # → fund the returned G-address with XLM. It is a hot wallet behind
#   #   public endpoints: keep in it what a few weeks of use need, and let
#   #   the low-balance alert ask for more.

name = "hitz-gravity"
main = "functions/worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Static assets from the Next.js export. The Worker only runs for /api/*
# and /mcp (the MCP server for AI agents); everything else (HTML, JS, CSS)
# is served directly off Cloudflare's edge without invoking the Worker.
# `not_found_handling = "404-page"` uses out/_not-found* as the 404
# response for non-API misses.
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/mcp"]

[[kv_namespaces]]
binding = "MAGIC_LINKS"
id = "d3cc545193ba45efaac265c9a72b2a65"

# On-chain data store: HITZ contract events + report caches (formerly the
# git-committed reports/data/ files) and HITZ/USD price history. Schema in
# migrations/; apply with `npx wrangler d1 migrations apply hitz-data --remote`.
[[d1_databases]]
binding = "DB"
database_name = "hitz-data"
database_id = "4216918c-c4e0-4b49-a10e-57395e8856af"
migrations_dir = "migrations"

# Ingestion cron (functions/_lib/ingest.ts). Soroban RPC keeps ~7 days of
# events; every 5 minutes leaves a wide margin and keeps the price feed fresh.
# The second schedule is the arbitrage bot (functions/_lib/arb-worker.ts),
# offset by two minutes so the two never share an invocation.
[triggers]
crons = ["*/5 * * * *", "2-59/5 * * * *"]

# Native Cloudflare email binding — replaces the old MailChannels HTTP
# call. No `destination_address` / `allowed_destination_addresses` means
# we can send to any recipient, which we need since magic-link + claim
# mails go to arbitrary user-provided addresses. The sender domain
# (EMAIL_FROM below) must have Email Routing enabled.
[[send_email]]
name = "SEND_EMAIL"

[vars]
APP_URL = "https://skyhitz.io"
EMAIL_FROM = "noreply@skyhitz.io"
EMAIL_FROM_NAME = "HITZ"
HITZ_CONTRACT_ID = "CBAPZAZNNB4X3VPXV2LYA5RMV7XHXIVREES2GG7R5GUXDZ4R4CKOY4EU"
RPC_URL = "https://soroban-rpc.mainnet.stellar.gateway.fm"
HORIZON_URL = "https://horizon.stellar.org"
NETWORK_PASSPHRASE = "Public Global Stellar Network ; September 2015"
# Gateway guards (functions/_lib/stellar.ts, limits.ts). Email accounts are
# created with a zero balance and fully sponsored: the sponsor locks 1 XLM
# per account (1.5 with a USDC trustline) and gives none away.
#   GATEWAY_MIN_SPONSOR_XLM: below this much SPENDABLE XLM the sponsor stops
#     sponsoring transactions and new accounts until it is topped up.
#   GATEWAY_MAX_NEW_ACCOUNTS_PER_DAY: new email accounts per day, all callers
#     together. Raise it for a campaign; legacy reparation claims don't count.
GATEWAY_MIN_SPONSOR_XLM = "5"
GATEWAY_MAX_NEW_ACCOUNTS_PER_DAY = "30"
# Operator inbox for "user X claimed Y HITZ" notices and sponsor low-balance
# alerts. Free-text mailbox. Anything that can receive mail works.
SUPPORT_EMAIL = "support@skyhitz.io"
# Spendable XLM (balance minus locked reserves) below which the sponsor
# account fires a low-balance alert, at most once a day. Checked by the cron
# and after every claim. Numeric string. Floats accepted.
LOW_BALANCE_THRESHOLD_XLM = "50"
# USDC issuer (Circle on mainnet). An email account gets a USDC trustline the
# first time it swaps into USDC; the sponsor holds that trustline's reserve
# (0.5 XLM), so the account needs no XLM of its own.
USDC_ISSUER = "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
# Arbitrage bot (functions/_lib/arb-worker.ts, strategy in ARB_BOT.md).
# "off" | "dry-run" (plans and simulates, sends nothing) | "live" (also needs
# the secret: `npx wrangler secret put ARB_BOT_SECRET`, the key of this
# address only). Status: GET /api/v1/bot.
# Optional, as numeric strings: ARB_BOT_MIN_PROFIT_XLM (the least a round trip
# must earn after network fees, default "0.02") and ARB_BOT_MAX_TRADE_XLM (the
# largest trade, default "150").
ARB_BOT_MODE = "dry-run"
ARB_BOT_ADDRESS = ""
