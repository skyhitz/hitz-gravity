# Monthly on-chain activity report for the HITZ contract.
#
# Runs at 12:05 UTC on the 1st of every month: generates a markdown report
# for the *previous* month and commits it to main.
#
# The event data lives in Cloudflare D1 (`hitz-data`), kept current by the
# Worker's ingestion cron every 5 minutes. The generator reads it through
# the Worker's public read API (https://skyhitz.io/api/data/*), so this job
# needs no Cloudflare credentials and no npm install — the script uses only
# Node built-ins. See reports/README.md.
#
# Trigger manually any time via the Actions tab → "Run workflow".

name: Monthly HITZ Report

on:
  schedule:
    # Day-of-month=1, hour=12 UTC. Slight offset (:05) avoids the
    # cron stampede that hits providers right on the hour.
    - cron: "5 12 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report (YYYY-MM). Defaults to last month."
        required: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pipe untrusted input (workflow_dispatch.month) through an env var
      # rather than ${{ ... }} interpolation in the shell. This is GitHub's
      # recommended pattern for avoiding script injection — the contents
      # never get evaluated by the shell parser, only by `[[ =~ ]]`.
      # Also enforce a strict YYYY-MM format so downstream consumers
      # (file paths, commit messages) can trust the value.
      - name: Determine report month
        id: month
        env:
          INPUT_MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ -n "$INPUT_MONTH" ]; then
            if ! [[ "$INPUT_MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
              echo "::error::month must match YYYY-MM (got: $INPUT_MONTH)"
              exit 1
            fi
            ym="$INPUT_MONTH"
          else
            # Default: last calendar month (`-d "last month"` is GNU date)
            ym="$(date -d 'last month' -u +'%Y-%m')"
          fi
          echo "ym=$ym" >> "$GITHUB_OUTPUT"

      - name: Generate report
        env:
          YM: ${{ steps.month.outputs.ym }}
        run: node frontend/scripts/contract-report.mjs generate "$YM"

      - name: Commit report
        env:
          YM: ${{ steps.month.outputs.ym }}
        run: |
          if [ -z "$(git status --porcelain reports/)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "reports/$YM.md"
          git commit -m "chore(reports): monthly HITZ activity $YM"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git push
