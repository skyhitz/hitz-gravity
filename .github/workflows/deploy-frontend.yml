# Deploys the site and its Worker (frontend/) to Cloudflare on every push to
# main that touches frontend/, and on demand from the Actions tab.
#
#   1. Install from the lockfile, run the tests, build the static export.
#   2. Apply pending D1 migrations. A Worker that reads a new schema must not
#      go out before it; with nothing pending this is a no-op.
#   3. wrangler deploy: the Worker and the static assets together.
#
# Needs two repository secrets (Settings, Secrets and variables, Actions):
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template,
#                          with Account, D1, Edit added for the migrations
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the hitz-gravity Worker
#
# Deploys run one at a time and in order: a newer push waits for the one in
# flight instead of cancelling it. Only main deploys, even when the workflow
# is started by hand on another branch.

name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Pinned so a wrangler release can't change a deploy unannounced; bump it on purpose.
      WRANGLER: wrangler@4.161.0
      WRANGLER_SEND_METRICS: "false"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare secrets are set
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings, Secrets and variables, Actions, then run this workflow again."
            exit 1
          fi

      # Node 22: wrangler needs 22.12 or later, and the tests strip TypeScript types.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm at the version frontend/package.json pins (packageManager), through corepack.
      - name: pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: D1 migrations
        run: npx --yes "$WRANGLER" d1 migrations apply hitz-data --remote

      - name: Deploy
        run: npx --yes "$WRANGLER" deploy --message "GitHub Actions, ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
