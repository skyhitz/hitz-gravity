# Deploys docs.skyhitz.io (the Cloudflare Pages project skyhitz-docs) on every
# push to main that changes what the site is built from, and on demand from the
# Actions tab.
#
# The site is built from docs/ and from the repo markdown that
# docs/scripts/sync.mjs publishes (its PAGES list). The paths below must name
# every one of those files: sync.mjs refuses to build while one is missing, so
# a new page can't silently stop deploying.
#
#   1. Install from the lockfile.
#   2. Build: sync.mjs, then Docusaurus, which fails on a broken link or anchor.
#   3. wrangler pages deploy to the production branch (main).
#
# Uses the same secrets as deploy-frontend.yml, from the repository's
# "Cloudflare" environment (Settings, Environments, Cloudflare):
#   CLOUDFLARE_API_TOKEN   must include Account, Cloudflare Pages, Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the skyhitz-docs project
#
# Deploys run one at a time and in order: a newer push waits for the one in
# flight instead of cancelling it. Only main deploys, even when the workflow
# is started by hand on another branch.

name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
      - "README.md"
      - "WHITEPAPER.md"
      - "AUDIT.md"
      - "LEGAL.md"
      - "TESTNET.md"
      - "contracts/sovereign-vault/INTEGRATION.md"
      - "contracts/sovereign-vault/MIGRATION.md"
      - "frontend/ARB_BOT.md"
      - "frontend/README.md"
      - "reports/README.md"
      - "research/arb-bot-replay/README.md"
      - "research/vault-backtest/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    # The secrets live in the repository's "Cloudflare" environment.
    environment:
      name: Cloudflare
      url: https://docs.skyhitz.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Pinned like deploy-frontend.yml, so a wrangler release can't change a deploy unannounced.
      WRANGLER: wrangler@4.161.0
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare secrets are set
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Add them to the Cloudflare environment (Settings, Environments), then run this workflow again."
            exit 1
          fi

      # Node 22: wrangler needs 22.12 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: >-
          npx --yes "$WRANGLER" pages deploy build
          --project-name skyhitz-docs
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "GitHub Actions, ${GITHUB_SHA::7}"
